<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Komastudy</title>


<style>
:root{color-scheme:light!important;--bg:#F8F8F1!important;--card:#fff!important;--ink:#394F45!important;--mut:#698C7C!important;--line:#dce5da!important;--soft:#f1f4ec!important;--pri:#698C7C!important;--pri-soft:#E4EEE5!important;--red:#a76e49!important;--red-soft:#f4e8da!important;--ok:#527b62!important;--ok-soft:#e4eee5!important;}

/* VOICE: 다정하지만 단정한 가정용 공부 도구. 군더더기 없이 오늘 할 일부터.
   IDEA: 책상 위 수험 다이어리 — 뜯어 쓰는 D-day 달력과 줄 노트.
   PICTURE: 큰 D-day 숫자 카드, 줄 노트 같은 시간표, 큰 원형 타이머.
   COLOUR and TYPE: 흰 종이, 파란 볼펜 잉크(주), 빨간 색연필(강조). Black Han Sans 숫자 + Noto Sans KR.
   LAYOUT: 상단 사용자/탭, 본문 한 열(넓으면 2열), 600px 이하 세로 쌓기. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ec,#14171d);--card:light-dark(#ffffff,#1d2129);--ink:light-dark(#1b2230,#e8eaef);--mut:light-dark(#687081,#9aa2b2);
--line:light-dark(#e4e0d6,#2c323d);--soft:light-dark(#f7f5f0,#232832);--pri:light-dark(#2547c9,#7f9bff);--pri-soft:light-dark(#e7ecfd,#232c4a);
--red:light-dark(#e0452b,#ff7a5f);--red-soft:light-dark(#fdebe6,#3a2420);--ok:light-dark(#1f9a5f,#4fd08f);--ok-soft:light-dark(#e3f5ec,#1d3329);
--sh:0 1px 2px rgb(0 0 0/.05),0 4px 14px rgb(0 0 0/.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Noto Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(3vw,12px) 80px}
/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px max(3vw,12px) 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--pri);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.who>*{flex:none}.btn,.chip,.seg button,.tabs button{white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.role{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:700}
.role.kid{background:var(--ok-soft);color:var(--ok)}
.tabs{max-width:1080px;margin:0 auto;padding:6px max(3vw,12px) 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:10px 14px 12px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;font-size:15px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.note-bar{background:var(--pri-soft);color:var(--pri);font-size:13.5px;padding:8px 12px;border-radius:10px;margin:12px 0 0}
.note-bar.warn{background:var(--red-soft);color:var(--red)}
/* cards */
.sec{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.h h2{font-size:18px;margin:0 auto 0 0;font-weight:900}
.h h3{font-size:16px;margin:0 auto 0 0;font-weight:800}
.mut{color:var(--mut)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;min-height:42px;padding:8px 14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.icon:hover{background:var(--soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 85%,var(--ink));white-space:nowrap}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--mut);min-height:34px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
/* d-day */
.dd-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.dd{flex:none;width:150px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;text-align:left;box-shadow:var(--sh)}
.dd .tear{height:8px;background:var(--c);opacity:.85}
.dd .in{padding:10px 12px 12px}
.dd b.num{display:block;font-size:30px;line-height:1.1;margin:4px 0 2px}
.dd.hot b.num{color:var(--red)}
.dd-empty{padding:18px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mut);text-align:center}
/* mission banner */
.mb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;background:var(--red-soft);color:var(--ink);margin-top:10px}
.mb .num{font-size:22px;color:var(--red);flex:none}
.mb .bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--red) 18%,transparent);margin-top:6px;overflow:hidden}
.mb .bar i{display:block;height:100%;background:var(--red)}
/* streak */
.streak{display:flex;gap:16px;align-items:center}
.flame{width:64px;height:64px;flex:none}
.streak .num{font-size:40px;line-height:1}
.prog{height:10px;border-radius:9px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .4s}
.prog.ok i{background:var(--ok)}
.dots{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.dots span{width:16px;height:16px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.dots span.p{background:color-mix(in srgb,var(--red) 35%,var(--card));border-color:transparent}
.dots span.y{background:var(--red);border-color:transparent}
.dots span.t{outline:2px solid var(--ink);outline-offset:1px}
/* family */
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fc{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.fc.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.fc .nm{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:700;font-size:13px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.live.pz{color:var(--mut)}.live.pz::before{background:var(--mut);animation:none}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live::before{animation:none}.prog i{transition:none}}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-top:6px}
/* tasks */
.dnav{display:flex;align-items:center;gap:4px}
.dnav .lbl{font-weight:800;min-width:110px;text-align:center}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--mut);margin:-2px 0 10px}
.sum b{color:var(--ink)}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ti{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.chk{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;font-weight:900}
.ti.done .chk,.mi.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ti .main{flex:1}
.ti .tt{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ti.done .tt span.x{text-decoration:line-through;color:var(--mut)}
.ti .meta{font-size:12.5px;color:var(--mut);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.by{font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--pri-soft);color:var(--pri);font-weight:700}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
/* timetable */
.tt-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:720px){.tt-wrap{grid-template-columns:minmax(0,1fr)}}
.pool{min-height:120px;border:1.5px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.pool.over{background:var(--pri-soft);border-color:var(--pri)}
@media(max-width:720px){.pool{flex-direction:row;flex-wrap:wrap;min-height:70px}.pool .pc{flex:1 1 150px}}
.pc{border:1px solid var(--line);border-left:5px solid var(--c);background:var(--card);border-radius:10px;padding:8px 10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font-size:14px;box-shadow:var(--sh)}
.pc .s{font-size:12px;color:var(--mut)}
.tt-scroll{max-height:68vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);overscroll-behavior:contain}
#ttGrid{position:relative;margin-left:0}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr.half{border-top-style:dashed;opacity:.6}
.hr span{position:absolute;left:8px;top:-9px;font-size:12px;color:var(--mut);background:var(--card);padding:0 4px;font-variant-numeric:tabular-nums}
.blk{position:absolute;border-radius:9px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:5px solid var(--c);padding:3px 8px;font-size:13px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1.3}
.blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{font-size:11.5px;color:var(--mut);white-space:nowrap}
.blk.done{opacity:.55}.blk.done b{text-decoration:line-through}
.rz{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize}
.rz::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:3px;margin-left:-13px;border-radius:3px;background:color-mix(in srgb,var(--c) 60%,transparent)}
.prev{position:absolute;border-radius:9px;border:2px dashed var(--pri);background:var(--pri-soft);pointer-events:none;opacity:.8}
.now{position:absolute;left:52px;right:0;border-top:2px solid var(--red);pointer-events:none;z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.dghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgb(0 0 0/.2);transform:rotate(-1.5deg)}
.dragging{opacity:.3}
/* timer */
.tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:760px){.tm{grid-template-columns:minmax(0,1fr)}}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto 12px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .clock{font-size:clamp(40px,11vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl .btn{min-width:110px;min-height:50px;font-size:16px;border-radius:14px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.pk{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;min-height:46px}
.pk.on{border-color:var(--pri);background:var(--pri-soft)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px;min-height:44px}
.sl{list-style:none;margin:0;padding:0}
.sl li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sl li .r{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* exams */
.ex{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.ex-h{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left;border:0;background:none}
.ex-d{flex:none;width:84px;text-align:center;border-right:1px dashed var(--line);padding-right:12px}
.ex-d .num{font-size:28px;line-height:1.05;display:block}
.ex.hot .ex-d .num{color:var(--red)}
.ex.past{opacity:.65}
.ex-b{padding:0 16px 16px}
.ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:640px){.ms{grid-template-columns:minmax(0,1fr)}}
.mst{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.mst.active{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.mst h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.st{font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:700;background:var(--card);color:var(--mut)}
.mst.active .st{background:var(--red);color:#fff}
.mi{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.mi .chk{width:26px;height:26px;border-radius:7px}
.mi.done span.x{text-decoration:line-through;color:var(--mut)}
.mi.lock .chk{opacity:.4;cursor:default}
.mi .icon{width:28px;height:28px;margin-left:auto}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .num{font-size:clamp(22px,4vw,28px);line-height:1.15;display:block;margin-top:2px}
.bars{position:relative;height:170px;display:flex;align-items:flex-end;gap:4px;padding:0 0 22px;margin-top:8px}
.bars .b{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.bars .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--pri);min-height:2px}
.bars .b.ok i{background:var(--ok)}
.bars .b.t i{background:var(--red)}
.bars .b span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap}
.gl{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--red) 70%,transparent);pointer-events:none}
.gl em{position:absolute;right:0;top:-19px;font-size:11px;font-style:normal;color:var(--red);background:var(--card);padding:0 4px}
.sr{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.sb{height:14px;border-radius:7px;background:var(--soft);position:relative;overflow:hidden;border:1px solid var(--line)}
.sb .pl{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 22%,transparent)}
.sb .ac{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:7px}
.sr .v{font-size:12.5px;color:var(--mut);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sr .v b{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:340px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-size:10.5px;display:grid;place-items:center;color:var(--mut)}
.cal .wd{background:none;border:0;aspect-ratio:auto;font-weight:700}
.cal .l1{background:color-mix(in srgb,var(--red) 25%,var(--card));border-color:transparent;color:var(--ink)}
.cal .l2{background:color-mix(in srgb,var(--red) 50%,var(--card));border-color:transparent;color:var(--ink)}
.cal .l3{background:var(--red);border-color:transparent;color:#fff}
.cal .fu{opacity:.35}
.cal .td{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* who / setup */
.hero{padding:40px 0 10px;text-align:center}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 8px;font-weight:900;text-wrap:balance}
.whos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;max-width:720px;margin:26px auto 0}
.wc{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--sh);font-weight:800;font-size:17px}
.wc .av{width:58px;height:58px;font-size:24px}
.wc:hover{border-color:var(--pri)}
.setup{max-width:460px;margin:20px auto 0}
/* modal */
.ov{position:fixed;inset:0;background:rgb(10 14 22/.45);z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{width:min(520px,100%);background:var(--card);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgb(0 0 0/.3);max-height:calc(100vh - 32px);overflow-y:auto}
.m-head{display:flex;align-items:center;margin-bottom:8px}
.m-head h3{margin:0 auto 0 0;font-size:18px;font-weight:900}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13.5px;font-weight:700;color:var(--mut)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px;font-weight:400;color:var(--ink);min-height:44px;width:100%}
.f textarea{min-height:74px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m-foot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.m-foot .sp{flex:1}
.note{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:9px 11px;margin:0 0 12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;align-items:end;margin-bottom:8px}
.srow .f{margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.load{padding:80px 0;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="app"><div class="load">불러오는 중…</div></div>
<div id="mroot"></div>
<div id="aroot"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
{
'use strict';
/* ---------- 기본 도구 ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const diffDays=(a,b)=>{const[y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)};
const ddLabel=n=>n>0?'D-'+n:n===0?'D-DAY':'D+'+(-n);
const WD='일월화수목금토';
const fmtDate=s=>{const d=parseD(s);return(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'};
const fmtShort=s=>{const d=parseD(s);return(d.getMonth()+1)+'/'+d.getDate()+' '+WD[d.getDay()]};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+'분';const h=Math.floor(m/60),r=m%60;return h+'시간'+(r?' '+r+'분':'')};
const fmtSec=s=>{s=Math.round(s||0);return s>0&&s<60?s+'초':fmtMin(Math.floor(s/60))};
const fmtClock=sec=>{sec=Math.max(0,Math.floor(sec));return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60)};
const fmtHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

const SUBJECTS=['국어','영어','수학','사회','과학','역사','도덕','한국사','기술가정','정보','한문','기타'];
const SUBJ_COLOR={국어:'#e0663a',영어:'#2f6fe0',수학:'#1f9a5f',사회:'#c99312',과학:'#8b4fd1',역사:'#b8572a',한국사:'#b8572a',도덕:'#d2477a',기술가정:'#1c97ab',정보:'#4b5ccc',한문:'#7a8b2e',기타:'#6b7280'};
const PAL=['#2f6fe0','#e0663a','#1f9a5f','#8b4fd1','#c99312','#d2477a','#1c97ab','#7a8b2e','#b8572a','#4b5ccc'];
const KID_COLORS=['#2f6fe0','#e0663a','#1f9a5f','#8b4fd1','#d2477a','#1c97ab'];
const subjColor=s=>{if(SUBJ_COLOR[s])return SUBJ_COLOR[s];let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const tagH=s=>`<span class="tag" style="--c:${subjColor(s)}">${esc(s||'기타')}</span>`;

const MISSIONS={
  d3:{title:'D-3 복습 미션',open:[3,2],items:['시험 범위 최종 확인하기','오답노트 처음부터 다시 보기','핵심 개념·공식 한 장으로 요약하기','기출·예상 문제 1회 풀기','틀린 문제 다시 풀어보기']},
  d1:{title:'D-1 준비 미션',open:[1,0],items:['요약 노트 마지막으로 훑어보기','자주 틀린 유형 다시 확인하기','시험 시간표·교시 확인하기','필기구·컴퓨터용 사인펜·수정테이프 챙기기','시계·학생증 챙기기','밤 11시 전에 잠자리에 들기']}
};
const TT_S=0,TT_E=24*60,ROW=40; // 30분 = 40px

/* ---------- 상태 ---------- */
const S={books:{},children:{},exams:{},tasks:{},sessions:{},missions:{},live:{},settings:{}};
const COLS=Object.keys(S);
let MODE='loading',DB=null,synced=false,netWarn=false,readOnly=false;
const UI={tab:'home',role:lsGet('sp_role'),childId:lsGet('sp_child'),date:today(),range:'7',timerPick:null,timerSubj:'',openEx:{},showPast:false,ttScroll:null};
let lastToday=today();

const app=document.getElementById('app'),mroot=document.getElementById('mroot'),aroot=document.getElementById('aroot');
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600)}

/* ---------- 저장 ---------- */
const chains={};
function saveLocal(){if(MODE!=='local')return;try{localStorage.setItem('sp_data_v1',JSON.stringify(S))}catch(e){console.warn('저장소 접근 실패',e);setTimeout(()=>toast('브라우저 저장소를 사용할 수 없어요. 기록 유지를 위해 Chrome에서 파일을 직접 열어 주세요.'),100)}}
function onWriteErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'){if(!readOnly){readOnly=true;toast('저장 권한이 없어요. 공유 권한을 "참여자" 이상으로 받아야 해요.');scheduleRender()}}
  else if(c==='quota_exceeded')toast('저장 공간이 가득 찼어요. 오래된 기록을 지워 주세요.');
  else toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
}
function write(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(onWriteErr)}
function put(col,obj){
  if(readOnly){toast('보기 전용이라 저장할 수 없어요.');return}
  S[col]={...S[col],[obj.id]:obj};
  if(MODE==='cloud'){const data=clone(obj);write(col+'/'+obj.id,()=>DB.doc(col+'/'+obj.id).set(data))}else saveLocal();
  scheduleRender();
}
function del(col,id){
  if(readOnly){toast('보기 전용이라 삭제할 수 없어요.');return}
  const m={...S[col]};delete m[id];S[col]=m;
  if(MODE==='cloud')write(col+'/'+id,()=>DB.doc(col+'/'+id).delete());else saveLocal();
  scheduleRender();
}

/* ---------- 조회 ---------- */
const kids=()=>Object.values(S.children).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name)));
const cur=()=>S.children[UI.childId];
const isParent=()=>UI.role==='parent';
const goalOf=c=>Number(c&&c.goalMin)||60;
const settings=()=>S.settings.main||{};
const tasksOf=(cid,date)=>Object.values(S.tasks).filter(t=>t.childId===cid&&t.date===date&&!t.skipped).sort((a,b)=>(a.start??9999)-(b.start??9999)||(a.created||0)-(b.created||0));
const sessOf=cid=>Object.values(S.sessions).filter(s=>s.childId===cid);
const examsOf=cid=>Object.values(S.exams).filter(e=>e.childId===cid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function secByDate(cid){const m={};for(const s of sessOf(cid))m[s.date]=(m[s.date]||0)+(s.sec||0);return m}
const taskSec=id=>Object.values(S.sessions).reduce((a,s)=>a+(s.taskId===id?(s.sec||0):0),0);
const liveEl=L=>(L.acc||0)+(L.state==='running'?Math.max(0,(Date.now()-L.startedAt)/1000):0);
function streak(cid){
  const goal=goalOf(S.children[cid])*60,by=secByDate(cid),ok=d=>(by[d]||0)>=goal,t=today();
  let n=0,d=ok(t)?t:addDays(t,-1);while(ok(d)){n++;d=addDays(d,-1)}
  let best=0,run=0,prev=null;for(const x of Object.keys(by).filter(ok).sort()){run=prev&&diffDays(prev,x)===1?run+1:1;best=Math.max(best,run);prev=x}
  return{cur:n,best,todayOk:ok(t),todaySec:by[t]||0,goal,by};
}
function stageState(dd,st){const o=MISSIONS[st].open;if(dd>o[0])return'locked';if(dd>=o[1])return'active';return'past'}
function mItems(ex,st){const m=S.missions[ex.id]||{};const base=MISSIONS[st].items.map((t,i)=>({key:st+'_'+i,text:t}));const cu=((m.custom||{})[st]||[]).map(x=>({key:'c_'+x.id,text:x.text,cid:x.id}));return base.concat(cu)}
function mProg(ex,st){const ch=(S.missions[ex.id]||{}).checks||{};const it=mItems(ex,st);return{done:it.filter(i=>ch[i.key]).length,total:it.length}}
function subjectsKnown(){const s=new Set(SUBJECTS);for(const e of Object.values(S.exams))s.add(e.subject);for(const t of Object.values(S.tasks))s.add(t.subject);return[...s].filter(Boolean)}
const datalist=()=>`<datalist id="subjList">${subjectsKnown().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;

/* ---------- 렌더 ---------- */
let rq=false,pending=false,ptrDown=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(force){
  const ae=document.activeElement;
  if(drag&&drag.started){pending=true;return}
  if(!force&&ae&&app.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){pending=true;return}
  pending=false;
  const sc=app.querySelector('.tt-scroll');if(sc)UI.ttScroll=sc.scrollTop;
  app.innerHTML=vRoot();
  const sc2=app.querySelector('.tt-scroll');
  if(sc2){if(UI.ttScroll==null){const ts=tasksOf(UI.childId,UI.date).filter(t=>t.start!=null);const first=ts.length?Math.min(...ts.map(t=>t.start)):(UI.date===today()?new Date().getHours()*60-60:14*60);UI.ttScroll=Math.max(0,(first-TT_S-30)/30*ROW)}sc2.scrollTop=UI.ttScroll}
  tick();
}
function flush(){if(pending)render()}
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
document.addEventListener('pointerup',()=>{ptrDown=false;if(pending)setTimeout(flush,0)},true);
document.addEventListener('pointercancel',()=>{ptrDown=false},true);
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!ptrDown)flush()},0));

function vRoot(){
  if(MODE==='login')return loginView();
  if(MODE==='loading')return`<div class="load">가족 공부 기록을 불러오는 중…${netWarn?'<br><br>아직 연결되지 않았어요. 네트워크를 확인해 주세요.':''}</div>`;
  if(!kids().length)return `<div class="load">연결된 자녀가 없습니다. <button data-act="who">로그아웃</button></div>`;
  if(!UI.role)return loginView();
  if(!S.children[UI.childId]){UI.childId=kids()[0].id;lsSet('sp_child',UI.childId)}
  const c=cur();
  const tabs=[['home','오늘'],['tt','시간표'],['timer','타이머'],['exams','시험·미션'],['books','학습 진도'],['stats','통계']];
  let h=`<header class="top"><div class="top-in"><div class="brand"><i>D</i>Komastudy</div><div class="who">`;
  if(isParent()){h+=`<span class="role">부모 모드</span>`+kids().map(k=>`<button class="chip ${k.id===UI.childId?'on':''}" data-act="selChild" data-id="${esc(k.id)}"><span class="dot" style="--c:${esc(k.color||'#2f6fe0')}"></span>${esc(k.name)}</button>`).join('')+`<button class="icon" data-act="settings" title="가족 설정" aria-label="가족 설정">${IC.gear}</button>`}
  else h+=`<span class="role kid">${esc(c.name)}</span>`;
  h+=`<button class="btn sm ghost" data-act="who">로그아웃</button></div></div><nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${UI.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</nav></header><div class="wrap">`;
  if(MODE==='local')h+=`<div class="note-bar">지금은 이 브라우저에만 저장돼요. 백업은 가족 설정에서 할 수 있어요.</div>`;
  if(MODE==='cloud')h+=`<div class="note-bar">클라우드 · ${netWarn?'연결/저장 오류 — 새로고침 전 확인':pendingWrites?'저장 중…':'연결됨 · 10초마다 갱신'}</div>`;
  if(netWarn&&MODE==='cloud')h+=`<div class="note-bar warn">서버와 연결이 늦어지고 있어요. 보이는 내용이 최신이 아닐 수 있어요.</div>`;
  if(readOnly)h+=`<div class="note-bar warn">보기 전용 권한이에요. 기록하려면 공유 권한을 "참여자"로 받아야 해요.</div>`;
  h+=({home:vHome,tt:vTT,timer:vTimer,exams:vExams,books:vBooks,stats:vStats}[UI.tab]||vHome)(c);
  return h+'</div>';
}
const IC={
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  edit:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  flame:'<svg class="flame" viewBox="0 0 64 64"><path d="M33 4c3 10-6 14-6 22 0 4 3 7 6 7-2-6 4-9 6-15 7 7 13 15 13 25 0 11-9 19-20 19S12 54 12 43c0-9 6-15 10-20 1 5 3 7 5 8C25 20 28 11 33 4z" fill="var(--fc,#e0452b)"/><path d="M32 60c-6 0-10-4-10-9 0-6 5-9 7-14 2 4 9 7 9 14 0 5-2 9-6 9z" fill="#ffd36a" opacity=".9"/></svg>'
};

/* ---------- 홈 ---------- */
function vHome(c){
  let h='';
  if(isParent()&&kids().length>1)h+=`<section class="sec"><div class="h"><h2>가족 한눈에 보기</h2></div><div class="fam">${kids().map(vFamCard).join('')}</div></section>`;
  h+=vBanners(c);
  h+=`<section class="sec"><div class="h"><h2>시험까지</h2><button class="btn sm" data-act="addExam">+ 시험 추가</button></div>${vDdays(c)}</section>`;
  h+=`<section class="sec grid2">${vStreak(c)}${vToday(c)}</section>`;
  return h;
}
function vFamCard(k){
  const st=streak(k.id),ts=tasksOf(k.id,today()),done=ts.filter(t=>t.done).length,L=S.live[k.id];
  const ex=examsOf(k.id).find(e=>diffDays(today(),e.date)>=0);
  const pct=Math.min(100,st.todaySec/st.goal*100);
  return`<button class="fc ${k.id===UI.childId?'on':''}" data-act="selChild" data-id="${esc(k.id)}">
  <div class="nm"><span class="av" style="--c:${esc(k.color)}">${esc(String(k.name).slice(0,1))}</span>${esc(k.name)}
  ${L?`<span class="live ${L.state==='running'?'':'pz'}" style="margin-left:auto">${L.state==='running'?'공부 중':'일시정지'} <span data-live="${esc(k.id)}"></span></span>`:''}</div>
  <div class="kv"><span class="mut">오늘 공부</span><b>${fmtSec(st.todaySec)} / ${fmtMin(goalOf(k))}</b></div>
  <div class="prog ${st.todayOk?'ok':''}" style="margin-top:6px"><i style="width:${pct}%"></i></div>
  <div class="kv"><span class="mut">오늘 할 일</span><b>${done}/${ts.length} 완료</b></div>
  <div class="kv"><span class="mut">연속 달성</span><b>${st.cur}일</b></div>
  <div class="kv"><span class="mut">가까운 시험</span><b>${ex?esc(ex.subject)+' '+ddLabel(diffDays(today(),ex.date)):'없음'}</b></div></button>`;
}
function vBanners(c){
  return examsOf(c.id).map(e=>{const dd=diffDays(today(),e.date);if(dd<0||dd>3)return'';
    const st=dd>=2?'d3':'d1',p=mProg(e,st);
    const msg=dd===0?'오늘 시험이에요. 준비물 다시 확인!':MISSIONS[st].title+' '+p.done+'/'+p.total;
    return`<button class="mb" data-act="goExam" data-id="${esc(e.id)}"><span class="num">${ddLabel(dd)}</span><span style="flex:1"><b>${esc(e.subject)}${e.name?' · '+esc(e.name):''}</b><span class="mut small"> — ${esc(msg)}</span><div class="bar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div></span><span class="mut">›</span></button>`}).join('');
}
function vDdays(c){
  const ex=examsOf(c.id).filter(e=>diffDays(today(),e.date)>=0);
  if(!ex.length)return`<div class="dd-empty">아직 등록된 시험이 없어요. 과목별 시험 날짜를 추가하면 남은 날짜를 세어 드려요.</div>`;
  return`<div class="dd-row">${ex.map(e=>{const dd=diffDays(today(),e.date);return`<button class="dd ${dd<=3?'hot':''}" style="--c:${subjColor(e.subject)}" data-act="goExam" data-id="${esc(e.id)}"><div class="tear"></div><div class="in">${tagH(e.subject)}<b class="num">${ddLabel(dd)}</b><span class="mut small">${fmtShort(e.date)}${e.name?' · '+esc(e.name):''}</span></div></button>`}).join('')}</div>`;
}
function vStreak(c){
  const st=streak(c.id),pct=Math.min(100,st.todaySec/st.goal*100),L=S.live[c.id];
  let dots='';for(let i=13;i>=0;i--){const d=addDays(today(),-i),s=st.by[d]||0;dots+=`<span class="${s>=st.goal?'y':s>0?'p':''} ${i===0?'t':''}" title="${fmtShort(d)} · ${fmtSec(s)}"></span>`}
  return`<div class="card"><div class="h"><h2>연속 공부</h2><span class="mut small">최고 ${st.best}일</span></div>
  <div class="streak"><span style="--fc:${st.cur?'var(--red)':'var(--line)'}">${IC.flame}</span><div><span class="num">${st.cur}</span><b> 일 연속</b><div class="mut small">${st.todayOk?'오늘 목표 달성! 내일도 이어가요.':st.cur?'오늘 목표를 채우면 '+(st.cur+1)+'일이 돼요.':'하루 목표를 채우면 기록이 시작돼요.'}</div></div></div>
  <div class="kv" style="margin-top:14px"><span>오늘 <b>${fmtSec(st.todaySec)}</b> / 목표 ${fmtMin(goalOf(c))}</span><b>${Math.floor(pct)}%</b></div>
  <div class="prog ${st.todayOk?'ok':''}" style="margin-top:6px"><i style="width:${pct}%"></i></div>

function lanes(list){
  const s=[...list].sort((a,b)=>a.start-b.start),out={};let group=[],end=-1;
  const close=()=>{const L=[];for(const t of group){let i=0;while(L[i]!=null&&L[i]>t.start)i++;L[i]=t.start+Math.max(15,+t.minutes||30);out[t.id]={i}}for(const t of group)out[t.id].n=L.length;group=[]};
  for(const t of s){if(t.start>=end&&group.length)close();group.push(t);end=Math.max(end,t.start+Math.max(15,+t.minutes||30))}
  if(group.length)close();return out;
}

  const rows=Object.entries(subj).sort((a,b)=>b[1].a-a[1].a||b[1].p-a[1].p),mx=Math.max(1,...rows.map(r=>Math.max(r[1].a,r[1].p)));
  const nextEx={};for(const e of examsOf(c.id)){const dd=diffDays(t,e.date);if(dd>=0&&(nextEx[e.subject]==null||dd<nextEx[e.subject]))nextEx[e.subject]=dd}

  return`<section class="sec"><div class="h"><h2>${esc(c.name)}의 학습 통계</h2><div class="seg">${[['7','7일'],['30','30일'],['all','전체']].map(([k,l])=>`<button class="${UI.range===k?'on':''}" data-act="range" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="kpis"><div class="kpi"><span class="mut small">총 공부 시간</span><span class="num">${fmtSec(tot)}</span></div>
  <div class="kpi"><span class="mut small">하루 평균</span><span class="num">${fmtMin(tot/60/n)}</span></div>
  <div class="kpi"><span class="mut small">할 일 완료율</span><span class="num">${rate==null?'–':rate+'%'}</span><span class="mut small">${dn}/${tk.length}개 완료</span></div>
  <div class="kpi"><span class="mut small">목표 달성일</span><span class="num">${goalDays}일</span><span class="mut small">현재 ${st.cur}일 연속 · 최고 ${st.best}일</span></div></div></section>
  <section class="sec grid2"><div class="card"><div class="h"><h3>날짜별 공부 시간</h3><span class="mut small">최근 ${cd.length}일</span></div>
  <div class="bars">${bars}<div class="gl" style="bottom:calc(22px + ${goal*60/bmax} * (100% - 22px))"><em>목표 ${fmtMin(goal)}</em></div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>목표 달성</span><span><i style="background:var(--pri)"></i>미달</span><span><i style="background:var(--red)"></i>오늘</span></div></div>
  <div class="card"><div class="h"><h3>할 일 완료율</h3></div><div style="display:flex;gap:18px;align-items:center">
  <svg width="110" height="110" viewBox="0 0 100 100" style="transform:rotate(-90deg);flex:none"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC*(1-(rate||0)/100)}"/></svg>
  <div><span class="num" style="font-size:34px">${rate==null?'–':rate+'%'}</span><div class="mut small">계획 ${tk.length}개 중 ${dn}개 완료<br>계획 시간 ${fmtMin(tk.reduce((a,x)=>a+(+x.minutes||0),0))} · 실제 ${fmtSec(tot)}</div></div></div>
  <div class="h" style="margin-top:16px"><h3>공부 달력</h3><span class="mut small">최근 5주</span></div><div class="cal">${cal}</div>
  <div class="legend"><span><i style="background:color-mix(in srgb,var(--red) 25%,var(--card))"></i>조금</span><span><i style="background:color-mix(in srgb,var(--red) 50%,var(--card))"></i>절반 이상</span><span><i style="background:var(--red)"></i>목표 달성</span></div></div></section>
  <section class="sec card"><div class="h"><h3>계획 대비 시간</h3></div><p>전체 시간 달성률 <b>${planSec?Math.round(tot/planSec*1000)/10+'%':'–'}</b> · 과목별 시간 충족률 <b>${planSec?Math.round(covered/planSec*1000)/10+'%':'–'}</b></p></section><section class="sec card"><div class="h"><h3>과목별 공부 시간</h3><span class="mut small">진한 막대 = 실제, 옅은 막대 = 계획</span></div>
  ${rows.length?rows.map(([s,v])=>`<div class="sr" style="--c:${subjColor(s)}"><span>${tagH(s)}${nextEx[s]!=null?` <span class="mut small">${ddLabel(nextEx[s])}</span>`:''}</span><div class="sb"><span class="pl" style="width:${v.p/mx*100}%"></span><span class="ac" style="width:${v.a/mx*100}%"></span></div><span class="v"><b>${fmtSec(v.a)}</b> / ${fmtSec(v.p)}${v.p?' ('+Math.round(v.a/v.p*100)+'%)':''}</span></div>`).join(''):'<div class="empty">이 기간의 기록이 없어요.</div>'}</section>`;
}

function openModal(title,body,onSubmit){
  mroot.innerHTML=`<div class="ov" data-act="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-head"><h3>${esc(title)}</h3><button type="button" class="icon" data-act="closeModal" aria-label="닫기">${IC.x}</button></div><form id="mform" novalidate>${body}</form></div></div>`;
  const f=document.getElementById('mform');
  f.addEventListener('submit',e=>{e.preventDefault();const bad=f.querySelector(':invalid');if(bad){bad.focus();bad.reportValidity();toast('입력값을 확인하세요: '+(bad.closest('label')?.textContent.trim()||bad.name));return}try{onSubmit(new FormData(f),f)}catch(err){console.error(err);toast('저장 중 오류가 발생했어요: '+err.message)}});
  const first=f.querySelector('input:not([type=hidden]),select,textarea');if(first)setTimeout(()=>first.focus(),30);
}
function closeModal(){mroot.innerHTML='';if(pending)render()}
function ask(msg,ok='확인',no='취소',danger){
  return new Promise(res=>{
    aroot.innerHTML=`<div class="ov" style="z-index:60"><div class="modal" role="alertdialog" style="max-width:380px"><p style="margin:4px 0 16px;font-weight:600">${esc(msg)}</p><div class="m-foot"><span class="sp"></span><button class="btn ghost" id="aNo">${esc(no)}</button><button class="btn ${danger?'red':'pri'}" id="aOk">${esc(ok)}</button></div></div></div>`;
    const done=v=>{aroot.innerHTML='';res(v)};
    document.getElementById('aNo').onclick=()=>done(false);document.getElementById('aOk').onclick=()=>done(true);document.getElementById('aOk').focus();
  });
}

  fd=>{const st=fd.get('start'),date=fd.get('date'),v={...t,subject:String(fd.get('subject')).trim(),title:String(fd.get('title')).trim(),date,minutes:+fd.get('minutes'),start:st===''?null:+st,bookId:fd.get('bookId')||'',qty:+fd.get('qty')||0};
  if(v.start!=null&&v.start+v.minutes>TT_E){toast('종료 시간이 자정을 넘어요.');return}

  if(isNew&&fd.get('repeat')!=='once'){const end=fd.get('until'),days=fd.getAll('weekday').map(Number);if(!end||end<date||diffDays(date,end)>366||(fd.get('repeat')==='weekly'&&!days.length)){toast('반복 기간(최대 1년)과 요일을 확인하세요.');return}const series=uid();let count=0;for(let d=date;d<=end;d=addDays(d,1)){if(fd.get('repeat')==='daily'||days.includes(parseD(d).getDay())){put('tasks',{...v,id:uid(),date:d,series});count++}}if(!count){toast('선택한 기간에 해당 요일이 없어요.');return}}

function taskQty(id){return Object.values(S.sessions).filter(s=>s.taskId===id).reduce((a,s)=>a+(+s.qty||0),0)}
function bookOptions(id){return '<option value="">교재 연결 없음</option>'+Object.values(S.books).filter(b=>b.childId===UI.childId).map(b=>`<option value="${b.id}" ${b.id===id?'selected':''}>${esc(b.subject+' · '+b.title+' ('+b.unit+')')}</option>`).join('')}
function bookFields(t){return `<label class="f">연결 교재<select name="bookId">${bookOptions(t.bookId)}</select></label><label class="f">목표 분량 (교재 단위)<input type="number" name="qty" min="0" value="${t.qty||0}"></label>`}
function skippedView(c){return Object.values(S.tasks).filter(t=>t.childId===c.id&&t.date===UI.date&&t.skipped).map(t=>`<div class="note">건너뜀 · ${esc(t.title)} <button class="btn sm" data-act="undoSkip" data-id="${t.id}">되돌리기</button></div>`).join('')}
function vBooks(c){return `<section class="sec"><div class="h"><h2>교재별 누적 학습 진도</h2><button class="btn pri" data-act="addBook">+ 교재 등록</button></div><div class="grid2">${Object.values(S.books).filter(b=>b.childId===c.id).map(b=>{const actual=(+b.initial||0)+sessOf(c.id).filter(s=>s.bookId===b.id).reduce((a,s)=>a+(+s.qty||0),0),remain=Math.max(0,b.total-actual),days=Math.max(1,diffDays(today(),b.deadline)+1);return `<div class="card"><div class="h">${tagH(b.subject)}<h3>${esc(b.title)}</h3><button class="btn sm" data-act="editBook" data-id="${b.id}">수정</button></div><div class="num" style="font-size:30px">${actual} / ${b.total} ${esc(b.unit)}</div><div class="prog"><i style="width:${Math.min(100,actual/b.total*100)}%"></i></div><p>남은 분량 ${remain}${esc(b.unit)} · ${Math.ceil(remain/days)}${esc(b.unit)}/일</p><p class="mut small">목표일 ${esc(b.deadline)} · ${Math.round(actual/b.total*100)}%</p></div>`}).join('')||'<div class="card">교재를 등록한 후 공부 계획과 연결하세요.</div>'}</div></section>`}
function bookForm(b){b=b||{id:uid(),childId:UI.childId,subject:'',title:'',unit:'문제',total:100,initial:0,deadline:addDays(today(),30)};openModal('교재 목표',`<label class="f">과목<input name="subject" list="subjList" required value="${esc(b.subject)}"></label>${datalist()}<label class="f">교재명<input name="title" required value="${esc(b.title)}"></label><label class="f">단위<input name="unit" required value="${esc(b.unit)}"></label><div class="row2"><label class="f">전체 분량<input name="total" type="number" min="1" required value="${b.total}"></label><label class="f">기존 완료 분량<input name="initial" type="number" min="0" value="${b.initial}"></label></div><label class="f">목표일<input type="date" name="deadline" required value="${b.deadline}"></label><p class="note">기존 완료 분량은 비워 두면 0으로 저장됩니다.</p><button type="submit" class="btn pri">저장</button>`,fd=>{if(readOnly){toast('보기 전용이라 저장할 수 없어요.');return}if(!String(fd.get('subject')).trim()||!String(fd.get('title')).trim()||!String(fd.get('unit')).trim()){toast('과목, 교재명, 단위를 입력하세요.');return}if(+fd.get('initial')>+fd.get('total')){toast('기존 완료 분량은 전체 분량 이하로 입력하세요.');return}put('books',{...b,subject:fd.get('subject').trim(),title:fd.get('title').trim(),unit:fd.get('unit'),total:+fd.get('total'),initial:+fd.get('initial'),deadline:fd.get('deadline')});UI.tab='books';closeModal();render(true);toast('교재가 등록되었습니다.')})}
function recordForm(s,taskId){const t=S.tasks[taskId||s?.taskId];s=s||{id:uid(),childId:UI.childId,date:t?.date||UI.date,subject:t?.subject||'',title:t?.title||'',taskId:t?.id||null,bookId:t?.bookId||'',sec:0,qty:0};const options='<option value="">자유 공부</option>'+Object.values(S.tasks).filter(x=>x.childId===UI.childId&&!x.skipped).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<option value="${x.id}" ${x.id===s.taskId?'selected':''}>${x.date} · ${esc(x.title)}</option>`).join('');openModal('실제 공부 기록',`<label class="f">연결 일정<select name="taskId">${options}</select></label><label class="f">과목 (자유 공부 시 입력)<input name="subject" list="subjList" value="${esc(s.subject)}"></label>${datalist()}<div class="row2"><label class="f">공부 날짜<input type="date" name="date" required value="${s.date}"></label><label class="f">실제 시간 (분)<input type="number" name="min" min="0" max="720" required value="${Math.round(s.sec/60*100)/100}" step="any"></label></div><label class="f">교재<select name="bookId">${bookOptions(s.bookId||t?.bookId)}</select></label><label class="f">실제 학습 분량<input type="number" name="qty" min="0" value="${s.qty||0}"></label><label class="f">이해도<select name="understanding">${['미선택','잘 이해함','조금 헷갈림','재학습 필요'].map(x=>`<option ${x===s.understanding?'selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" name="review" ${s.review?'checked':''}> 복습 필요</label><label class="f">학습 메모<textarea name="memo">${esc(s.memo||'')}</textarea></label><label><input type="checkbox" name="done" ${t?.done?'checked':''}> 연결 일정 완료 표시</label><div class="m-foot"><button class="btn pri">기록 저장</button></div>`,fd=>{const x=S.tasks[fd.get('taskId')],subject=x?.subject||fd.get('subject').trim(),bookId=fd.get('bookId')||x?.bookId||'',book=S.books[bookId];if(!subject||book&&book.subject!==subject){toast('과목과 교재를 확인하세요.');return}put('sessions',{...s,taskId:x?.id||null,subject,date:x?.date||fd.get('date'),title:x?.title||'자유 공부',bookId,sec:Math.round(+fd.get('min')*60),qty:+fd.get('qty')||0,understanding:fd.get('understanding'),review:fd.has('review'),memo:fd.get('memo'),endTs:Date.now()});if(x)put('tasks',{...x,done:fd.has('done')});closeModal();toast('기록과 누적 진도를 저장했어요.')})}

let client, pendingWrites=0, refreshBusy=false, generation=0, account=null, failed=false;
const URL2='https://qfbnlhsulfyvzooajvtb.supabase.co';
const KEY2='sb_publishable_0RKqvBpIkiUx48pHOwOjHA_7_xvCQyU';
function loginView(){return `<div class="wrap" style="max-width:420px;margin:60px auto"><div class="card"><h1>Komastudy</h1><p>가족 전용 클라우드 공부 플래너</p><form id="cloudLogin"><label class="f">이메일<input type="email" name="email" required autocomplete="username"></label><label class="f">비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button class="btn pri" type="submit">로그인</button><p id="loginError" role="alert"></p></form></div></div>`}
function checked(r){if(r.error)throw r.error;return r.data}
async function refreshCloud(){if(!account||refreshBusy||pendingWrites||failed)return;refreshBusy=true;const g=generation;try{const [students,records]=await Promise.all([client.from('students').select('id,name,daily_goal_minutes'),client.from('planner_records').select('*')]);const ks=checked(students),rs=checked(records);if(g!==generation||pendingWrites)return;const next={};for(const c of COLS)next[c]={};ks.forEach((k,i)=>next.children[k.id]={id:k.id,name:k.name,goalMin:k.daily_goal_minutes,color:KID_COLORS[i%KID_COLORS.length],order:i});for(const r of rs){if(next[r.collection]&&next.children[r.student_id])next[r.collection][r.record_id]={...r.payload,id:r.record_id,childId:r.student_id}}for(const c of COLS)S[c]=next[c];netWarn=false;synced=true;MODE='cloud';scheduleRender()}catch(e){netWarn=true;toast('클라우드 조회 실패: '+e.message);if(MODE==='loading'){MODE='login';account=null;}render(true)}finally{refreshBusy=false}}
async function enterCloud(user){account=user;const members=checked(await client.from('family_members').select('role,family_id').eq('user_id',user.id));if(members.length!==1)throw Error('가족 계정 연결을 확인하세요.');UI.role=members[0].role;UI.childId=null;UI.tab='home';MODE='loading';render(true);await refreshCloud()}
document.addEventListener('submit',async e=>{if(e.target.id!=='cloudLogin')return;e.preventDefault();const f=e.target,fd=new FormData(f),btn=f.querySelector('button');btn.disabled=true;try{const r=await client.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(r.error)throw r.error;await enterCloud(r.data.user)}catch(err){account=null;MODE='login';render(true);document.getElementById('loginError').textContent=err.message}finally{btn.disabled=false}});
let queue=Promise.resolve();
function enqueue(fn){pendingWrites++;const g=generation;queue=queue.then(async()=>{if(g!==generation)return;await fn()}).catch(e=>{failed=true;netWarn=true;toast('저장 실패: '+e.message+' · 백업 후 다시 로그인하세요.')}).finally(()=>{pendingWrites--;scheduleRender()})}
put=function(col,obj){if(!account||failed){toast('연결 상태를 확인하세요.');return}const data=clone(obj);const sid=col==='live'?obj.id:col==='missions'?S.exams[obj.id]?.childId:obj.childId;if(col==='children'){if(!isParent()||!S.children[obj.id])return;enqueue(async()=>checked(await client.from('students').update({name:data.name,daily_goal_minutes:data.goalMin}).eq('id',data.id).select('id').single()))}else{if(!S.children[sid]||!['books','tasks','sessions','exams','missions','live'].includes(col))return;enqueue(async()=>checked(await client.from('planner_records').upsert({student_id:sid,collection:col,record_id:data.id,payload:data}).select('record_id').single()))}S[col]={...S[col],[obj.id]:obj};scheduleRender()};
del=function(col,id){if(!account||failed||col==='children'||col==='settings')return;const o=S[col][id];if(!o)return;const sid=col==='live'?id:o.childId||S.exams[id]?.childId;if(!sid)return;enqueue(async()=>checked(await client.from('planner_records').delete().eq('student_id',sid).eq('collection',col).eq('record_id',id).select('record_id').single()));delete S[col][id];scheduleRender()};
ACT.who=async()=>{if(pendingWrites){toast('저장이 끝난 후 로그아웃하세요.');return}if(failed&&!confirm('저장 실패 기록이 있습니다. 백업하지 않고 로그아웃할까요?'))return;generation++;const result=await client.auth.signOut({scope:'local'});if(result.error){toast('로그아웃 실패: '+result.error.message);return}account=null;failed=false;netWarn=false;for(const c of COLS)S[c]={};UI.role=null;UI.childId=null;MODE='login';closeModal();render(true)};
ACT.pickChild=ACT.pickParent=()=>{};ACT.delKid=()=>toast('계정 삭제는 관리자 설정에서만 가능합니다.');ACT.restore=()=>toast('이전 버전 기록 이전은 별도 작업이 필요합니다.');
ACT.settings=()=>{if(!isParent())return;openModal('가족 설정',kids().map(k=>`<label class="f">이름<input name="n_${k.id}" required value="${esc(k.name)}"></label><label class="f">하루 목표<select name="g_${k.id}">${goalOpts(goalOf(k))}</select></label>`).join('')+'<button type="button" class="btn" data-act="backup">백업</button><button class="btn pri">저장</button>',fd=>{for(const k of kids())put('children',{...k,name:fd.get('n_'+k.id),goalMin:+fd.get('g_'+k.id)});closeModal()})};
const oldDelExam=ACT.delExam;ACT.delExam=async el=>{const e=S.exams[el.dataset.id];if(e&&await ask('시험을 삭제할까요?','삭제','취소',true)){if(S.missions[e.id])del('missions',e.id);del('exams',e.id);closeModal()}};
async function boot(){MODE='login';render(true);try{client=window.supabase.createClient(URL2,KEY2,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});setInterval(refreshCloud,10000);const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session?.user)await enterCloud(data.session.user)}catch(e){account=null;MODE='login';render(true);const el=document.getElementById('loginError');if(el)el.textContent='자동 로그인 또는 연결 실패: '+(e.message||'인터넷을 확인하세요.')}}
boot();
}
